<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Decisionmaker-pro Exercises — File Directory</title>
  <meta name="description" content="Directory of Decisionmaker pro exercise pages. Use search or filter tags to quickly find an exercise." />
  <link rel="icon" href="/favicon.svg" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #0e2a47 50%, #1e3a8a 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-hover-bg: rgba(255, 255, 255, 0.12);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f0f9ff;
      --text-muted: #93c5fd;
      --accent-blue: #38bdf8;
      --accent-hover: #7dd3fc;
      --badge-1: #38bdf8;
      --badge-2: #818cf8;
      --badge-3: #c084fc;
      --badge-default: #94a3b8;
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-full: 9999px;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: var(--text-main);
      background: var(--bg-gradient);
      background-attachment: fixed;
      font-size: 15px;
      line-height: 1.4;
    }

    .site {
      max-width: 1440px;
      margin: 10px auto;
      padding: 14px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
    }

    header {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
    }

    @media (min-width: 768px) {
      header { flex-direction: row; align-items: center; justify-content: space-between; }
    }

    .title h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    .title .muted { color: var(--text-muted); font-size: 0.72rem; margin-top: 2px; }
    .controls { display: flex; flex-direction: column; gap: 6px; min-width: min(300px, 100%); }

    .search {
      width: 100%;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--card-border);
      background: rgba(15, 23, 42, 0.6);
      color: var(--text-main);
      outline: none;
      font-size: 0.78rem;
      transition: var(--transition);
    }

    .search:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25); }
    .search::placeholder { color: rgba(147, 197, 253, 0.5); }
    .filter-tags { display: flex; gap: 5px; flex-wrap: wrap; }

    .filter-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .filter-btn:hover, .filter-btn.active { background: var(--accent-blue); color: #0f172a; border-color: var(--accent-blue); }

    .link-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .link-grid li { min-width: 0; margin: 0; }

    .exercise-btn {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
      min-height: 58px;
      text-decoration: none;
      padding: 7px 8px;
      border-radius: 8px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .exercise-btn:hover { background: var(--card-hover-bg); border-color: rgba(56, 189, 248, 0.4); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25); }
    .exercise-btn:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
    .btn-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }

    .exercise-btn .title {
      min-width: 0;
      font-weight: 600;
      font-size: 0.7rem;
      color: #ffffff;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }

    .tag { font-size: 0.56rem; font-weight: 700; padding: 1px 4px; border-radius: var(--radius-full); letter-spacing: 0.02em; color: #0f172a; flex-shrink: 0; white-space: nowrap; }
    .tag-1 { background: var(--badge-1); }
    .tag-2 { background: var(--badge-2); }
    .tag-3 { background: var(--badge-3); }
    .tag-none { background: var(--badge-default); }

    .btn-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 4px; font-size: 0.6rem; font-weight: 500; color: var(--accent-blue); gap: 3px; }
    .exercise-btn:hover .btn-footer { color: var(--accent-hover); }

    footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.08); color: var(--text-muted); font-size: 0.68rem; }
    #count { font-weight: 700; color: var(--accent-blue); }
    .skip { position: absolute; left: -9999px; }
    .skip:focus { left: 10px; top: 10px; background: var(--accent-blue); color: #000; padding: 8px; z-index: 100; }

    @media (max-width: 760px) {
      .site { margin: 8px; padding: 12px; }
      .controls { min-width: 0; }
      .link-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .site { margin: 6px; padding: 10px; border-radius: 12px; }
      .link-grid { grid-template-columns: minmax(0, 1fr); }
      footer { align-items: flex-start; flex-direction: column; gap: 3px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>

  <div class="site">
    <header>
      <div class="title">
        <h1>Decisionmaker Exercises</h1>
        <div class="muted">Interactive scenarios for language learners</div>
      </div>

      <div class="controls" role="search">
        <input id="filter" class="search" type="search" placeholder="Search exercises (press '/' to focus)" aria-label="Search pages" />
        <div class="filter-tags">
          <button class="filter-btn active" data-level="all">All</button>
          <button class="filter-btn" data-level="1">1 · Elementary</button>
          <button class="filter-btn" data-level="2">2 · Independent</button>
          <button class="filter-btn" data-level="3">3 · Proficient</button>
        </div>
      </div>
    </header>

    <main id="main">
      <nav aria-label="exercise directory">
        <ul id="pages" class="link-grid" aria-live="polite">
          <li>Loading exercises…</li>
        </ul>
      </nav>
    </main>

    <footer>
      <div>Decisionmaker Directory</div>
      <div>Showing <span id="count">0</span> exercises</div>
    </footer>
  </div>

  <script>
    (function(){
      const input = document.getElementById('filter');
      const list = document.getElementById('pages');
      let items = [];
      const count = document.getElementById('count');
      const filterBtns = document.querySelectorAll('.filter-btn');

      let currentLevel = 'all';
      const repoUrl = 'https://api.github.com/repos/Balmain-English/decisionmaker-pro/contents';

      function updateCount(){
        const visible = items.filter(li => li.style.display !== 'none').length;
        count.textContent = visible;
      }

      function applyFilters(){
        const query = input.value.trim().toLowerCase();
        items.forEach(li => {
          const text = li.textContent.toLowerCase();
          const tag = li.querySelector('.tag');
          const level = tag ? tag.textContent.trim().toLowerCase() : '';
          const matchesQuery = query === '' || text.includes(query);
          const matchesLevel = currentLevel === 'all' || level === currentLevel.toLowerCase();

          if (matchesQuery && matchesLevel) {
            li.style.display = '';
          } else {
            li.style.display = 'none';
          }
        });

        updateCount();
      }

      function debounce(fn, wait){
        let t = null;
        return function(...args){
          clearTimeout(t);
          t = setTimeout(() => fn.apply(this, args), wait);
        };
      }

      filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          currentLevel = e.target.getAttribute('data-level');
          applyFilters();
        });
      });

      window.addEventListener('keydown', e => {
        if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
          e.preventDefault();
          input.focus();
        }
      });

      input.addEventListener('input', debounce(applyFilters, 150));

      fetch(repoUrl + '?ref=main&t=' + Date.now())
        .then(res => {
          if (!res.ok) {
            throw new Error('GitHub API request failed: ' + res.status);
          }
          return res.json();
        })
        .then(files => {
          const htmlFiles = (files || []).filter(f => f.type === 'file' && f.name.endsWith('.html') && !/^index\.html$/i.test(f.name) && !/^(README|styles|favicon)\./i.test(f.name));

          htmlFiles.sort((a,b) => a.name.localeCompare(b.name));
          list.innerHTML = '';

          htmlFiles.forEach(f => {
            const name = f.name;
            const safeHref = encodeURI(name);
            const base = name.replace(/\.html$/i, '');

            const levelMatch = base.match(/-(\d+)(?:[a-z])?$/i);
            const rawLevel = levelMatch ? String(levelMatch[1]) : null;
            const tagClass = rawLevel ? 'tag-' + rawLevel : 'tag-none';
            const tagText = rawLevel || '—';

            let title = base.replace(/-(\d+)(?:[a-z])?$/i, '').replace(/-/g, ' ');
            title = title.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

            const li = document.createElement('li');
            const a = document.createElement('a');
            a.className = 'exercise-btn';
            a.href = safeHref;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            a.setAttribute('role', 'link');

            a.innerHTML = `
              <div class="btn-header"><span class="title">${escapeHtml(title)}</span><span class="tag ${tagClass}">${escapeHtml(tagText)}</span></div>
              <div class="btn-footer">Open &rarr;</div>
            `;

            li.appendChild(a);
            list.appendChild(li);
          });

          items = Array.from(list.querySelectorAll('li'));
          applyFilters();
        })
        .catch(err => {
          console.error('Failed to load repository contents', err);
          list.innerHTML = '<li class="empty">No exercises found. Please check the repository contents.</li>';
          items = Array.from(list.querySelectorAll('li'));
          updateCount();
        });

      function escapeHtml(str) {
        return String(str).replace(/[&"'<>]/g, function(s) {
          return ({'&':'&amp;','"':'&quot;','\'':'&#39;','<':'&lt;','>':'&gt;'})[s];
        });
      }

    })();
  </script>
</body>
</html>
