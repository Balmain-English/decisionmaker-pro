<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purchasing Decision Sim — Cosmetics Manufacturing</title>
<meta name="description" content="B2 professional English decision simulation for a cosmetics-industry purchaser.">
<style>
:root{--bg:#f4f6f5;--surface:#fff;--surface2:#eaf0ed;--ink:#1d2925;--ink2:#52635c;--muted:#7a8b83;--line:#d8e1dc;--green:#e1f1e5;--greenb:#75ad82;--greent:#1b512b;--amber:#fff0d4;--amberb:#d8a444;--ambert:#66470d;--red:#fbe5e3;--redb:#d27870;--redt:#711e19;--accent:#39765b;--radius:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:760px;margin:auto;padding:28px 16px 50px}.masthead{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:0 0 18px;margin-bottom:24px}.brand{font-weight:750;letter-spacing:-.02em}.sub{font-size:13px;color:var(--muted)}.badge{font-size:11px;font-weight:750;letter-spacing:.08em;border:1px solid #a8c5b5;background:#e4f0e9;color:#24563d;border-radius:20px;padding:5px 10px;white-space:nowrap}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 18px #23372c0b;overflow:hidden}.intro,.final{padding:30px}.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--accent);margin-bottom:10px}.intro h1{font-size:clamp(28px,5vw,38px);line-height:1.15;letter-spacing:-.035em;margin:0 0 12px}.intro h1 em{color:var(--accent)}.lead{color:var(--ink2);margin:0 0 22px}.chips{display:flex;flex-wrap:wrap;gap:7px;margin:16px 0 24px}.chip{background:var(--surface2);border:1px solid var(--line);padding:4px 10px;border-radius:18px;font-size:12px;color:var(--ink2)}.profile,.how{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:15px 17px;margin:16px 0}.profile strong,.how strong{display:block;margin-bottom:4px}.profile p,.how p{margin:0;color:var(--ink2);font-size:14px}.primary,.replay{width:100%;border:0;border-radius:9px;padding:14px 18px;font:inherit;font-weight:750;cursor:pointer}.primary{background:var(--ink);color:white}.primary:hover{background:#31473d}.replay{background:white;border:1px solid var(--line);color:var(--ink)}.cardbar{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.role{font-size:13px;color:var(--ink2)}.progress{display:flex;align-items:center;gap:4px}.dot{width:8px;height:8px;border-radius:50%;background:#d8e1dc}.dot.done{background:#65a879}.dot.active{background:#398b76}.score{font:700 12px ui-monospace,monospace;border:1px solid var(--greenb);background:var(--green);color:var(--greent);padding:4px 10px;border-radius:18px}.body{padding:24px}.time{font:700 11px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}.emergency{background:var(--red);color:var(--redt);border:1px solid var(--redb);border-radius:8px;padding:10px 12px;font-size:13px;font-weight:800;margin-bottom:14px}.vocab{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:15px}.vocab span{font-size:11px;color:var(--muted);margin-right:3px}.vocab b{font:600 11px ui-monospace,monospace;border:1px solid #b9d0c4;background:#e8f2ed;color:#285a43;border-radius:16px;padding:3px 8px}.scenario{line-height:1.8;margin:0 0 20px}.options{display:grid;gap:10px}.opt{width:100%;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;text-align:left;border:1px solid #cbd7d0;background:#fff;border-radius:9px;padding:13px 14px;font:inherit;font-size:14px;line-height:1.65;color:var(--ink);cursor:pointer}.opt:hover:not(:disabled){background:#f6f9f7;border-color:#779e89}.opt:disabled{cursor:default}.opt.good{background:var(--green);border-color:var(--greenb);color:var(--greent)}.opt.mid{background:var(--amber);border-color:var(--amberb);color:var(--ambert)}.opt.bad{background:var(--red);border-color:var(--redb);color:var(--redt)}.points{font:700 11px ui-monospace,monospace;border-radius:14px;padding:2px 7px;white-space:nowrap;opacity:0}.points.show{opacity:1}.feedback{display:none;border-radius:9px;padding:13px 15px;margin-top:15px;font-size:14px;line-height:1.7}.feedback.show{display:block}.feedback.good{background:var(--green);border:1px solid var(--greenb);color:var(--greent)}.feedback.mid{background:var(--amber);border:1px solid var(--amberb);color:var(--ambert)}.feedback.bad{background:var(--red);border:1px solid var(--redb);color:var(--redt)}.nextrow{display:flex;justify-content:flex-end;margin-top:16px}.next{display:none;border:0;background:var(--ink);color:white;border-radius:8px;padding:11px 20px;font:inherit;font-weight:750;cursor:pointer}.next.show{display:block}.final{text-align:left}.scoreblock{text-align:center;margin:10px 0 24px}.bigscore{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.05em}.denom{color:var(--muted);font:13px ui-monospace,monospace;margin-top:7px}.bar{height:9px;background:#dfe7e2;border-radius:10px;overflow:hidden;margin:18px 0}.fill{height:100%;background:var(--accent);width:0;transition:width .6s}.grade{text-align:center;font-size:22px;font-weight:800;margin:15px 0}.final p{line-height:1.8}.summary{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:15px;margin:20px 0}.summary h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}.footer{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}@media(max-width:520px){.intro,.final{padding:22px}.body{padding:19px}.cardbar{padding:14px 18px}.opt{font-size:13px}.bigscore{font-size:62px}}
</style>
</head>
<body>
<div class="shell">
<header class="masthead"><div><div class="brand">🧴 Cosmetics Purchasing Sim</div><div class="sub">B2 Professional Interaction · Decision-making under pressure</div></div><div class="badge">B2 UPPER-INT</div></header>
<div class="card" id="game"></div>
<footer class="footer">Professional English Simulation Series · Cosmetics Manufacturing</footer>
</div>
<script>
const STEPS = [
{time:"Day 1 — 08:30",vocab:["specification","lead time","to source"],scenario:"A new face cream is due to launch in eight weeks. The product development team has requested a glass jar with a specialist finish, but your usual supplier quotes a ten-week lead time. Marketing has already announced the launch date. What do you do?",choices:[
{text:"Explain the timing risk to the project team and ask the supplier whether a validated stock option or partial delivery could meet the deadline without changing the approved product requirements.",pts:3,fb:"Strong purchasing judgement. You make the risk visible early and explore workable options without quietly changing the specification.",type:"g"},
{text:"Place the order anyway and hope the supplier can deliver faster once production starts.",pts:1,fb:"This leaves a known schedule risk unmanaged and gives the team little time to react if the delivery is late.",type:"p"},
{text:"Ask the supplier to quote for a standard jar as a possible alternative, then present the cost and timing impact to the team before making a decision.",pts:2,fb:"A sensible alternative to investigate, but the team still needs a clear assessment of whether the change is acceptable and can be approved in time.",type:"o"}]},
{time:"Day 1 — 10:15",vocab:["minimum order quantity","forecast","to negotiate"],scenario:"A supplier of botanical extracts has increased its minimum order quantity (MOQ). The new quantity is twice your current forecast, and the extract has a limited shelf life. The supplier says the MOQ is non-negotiable.",choices:[
{text:"Accept the new MOQ to protect the relationship, even though a large part of the material may expire before it is used.",pts:1,fb:"This creates avoidable stock and obsolescence risk. A supplier relationship matters, but so do demand and shelf life.",type:"p"},
{text:"Share the forecast and ask about a call-off agreement, staged deliveries or a price adjustment for a smaller initial order.",pts:3,fb:"Excellent. You use demand information to explore commercial options and reduce the risk of holding excess stock.",type:"g"},
{text:"Ask the formulation team whether the extract can be removed from the product immediately so you can avoid the new MOQ.",pts:2,fb:"You are looking for a way to reduce exposure, but a formulation change needs technical assessment and approval rather than an immediate purchasing decision.",type:"o"}]},
{time:"Day 1 — 13:30",vocab:["certificate of analysis","traceability","to verify"],scenario:"A delivery of a key active ingredient arrives with a certificate of analysis (CoA) that does not match the batch number on the containers. Production is waiting for the material, and the supplier says the paperwork is probably just a typing error.",choices:[
{text:"Put the batch on hold and contact Quality Assurance and the supplier to verify the identity and documentation before the ingredient is released.",pts:3,fb:"Correct. Batch traceability and verified documentation are essential; production pressure does not justify releasing uncertain material.",type:"g"},
{text:"Tell the warehouse to use the ingredient because the supplier is reliable and the difference is probably administrative.",pts:1,fb:"This bypasses a critical quality check. The mismatch must be resolved and documented before use.",type:"p"},
{text:"Ask the supplier to email a corrected CoA, but allow production to begin while you wait for it.",pts:0,fb:"Unsafe decision. A promise of corrected paperwork is not evidence that the batch has been verified. Keep the material on hold.",type:"f",fatal:true}] ,emergency:true},
{time:"Day 1 — 15:00",vocab:["total cost of ownership","freight","to compare"],scenario:"You are comparing two packaging suppliers. Supplier A has the lowest unit price, but charges high freight costs and has a history of small, frequent delays. Supplier B costs 6% more per unit but offers consolidated deliveries and more reliable lead times.",choices:[
{text:"Recommend Supplier A because the unit price is the clearest figure to compare and easiest to report to management.",pts:1,fb:"Unit price alone can hide the real cost. Freight, delays, production disruption and inventory needs should also be considered.",type:"p"},
{text:"Compare the total landed cost and delivery performance, then present the trade-offs and risks to the budget owner.",pts:3,fb:"Excellent. A total-cost view gives stakeholders a more realistic basis for the decision.",type:"g"},
{text:"Choose Supplier B immediately because reliability is always more important than price.",pts:2,fb:"Reliability is important, but the decision should be supported by a comparison of costs, service levels and business impact.",type:"o"}]},
{time:"Day 2 — 09:00",vocab:["non-conformance","corrective action","to escalate"],scenario:"A batch of printed cartons arrives with the wrong shade of the brand colour. The difference is visible, but the supplier argues that it falls within normal printing variation. Marketing says the packaging must look consistent on the shelf.",choices:[
{text:"Ask Quality and Marketing to assess the samples against the approved colour standard, document the non-conformance and agree on the required corrective action with the supplier.",pts:3,fb:"Strong response. You use the approved standard and involve the right functions before agreeing on a remedy.",type:"g"},
{text:"Accept the cartons to avoid delaying production, and ask the supplier to improve the colour on the next order.",pts:1,fb:"This may create inconsistent packaging in the market and treats the current non-conformance as if it did not matter.",type:"p"},
{text:"Demand that the supplier replace the entire batch immediately, without waiting for a technical assessment.",pts:2,fb:"You protect the brand standard, but a documented assessment helps establish the correct remedy and supports a constructive supplier discussion.",type:"o"}]},
{time:"Day 2 — 10:45",vocab:["supplier audit","due diligence","to assess"],scenario:"A new supplier offers a very competitive price for a plant-based ingredient. However, it cannot provide clear information about the origin of the raw material or its subcontractors. The product team wants to approve the supplier quickly.",choices:[
{text:"Approve the supplier for a small order and collect the origin documents later if the ingredient performs well.",pts:1,fb:"This postpones due diligence until after commitment. Traceability and supplier requirements should be checked before approval.",type:"p"},
{text:"Explain the gaps to the product team and ask the supplier to provide the required traceability and compliance information before qualification proceeds.",pts:3,fb:"Correct. Commercial savings do not replace supplier qualification and responsible sourcing checks.",type:"g"},
{text:"Reject the supplier permanently because any missing document proves that the business is not trustworthy.",pts:2,fb:"A cautious position is understandable, but it is better to define the requirements and assess the supplier's response before reaching a final conclusion.",type:"o"}]},
{time:"Day 2 — 13:00",vocab:["safety stock","reorder point","to replenish"],scenario:"Your inventory report shows that a preservative used in several products is close to its reorder point. The supplier has recently extended its lead time, but the latest sales forecast is not yet confirmed.",choices:[
{text:"Increase the order substantially now so there is no chance of a shortage.",pts:1,fb:"A large speculative order can create excess stock and tie up cash. Check demand, current stock and the revised lead time first.",type:"p"},
{text:"Review current stock, confirmed demand, open orders and the revised lead time with planning, then adjust the replenishment quantity and timing.",pts:3,fb:"Good planning. You base the replenishment decision on current data and coordinate with the teams affected by a potential shortage.",type:"g"},
{text:"Wait for the sales forecast to be confirmed before taking any action, even if the reorder point is passed.",pts:2,fb:"Waiting for better information is reasonable, but the known lead-time risk needs active monitoring and a contingency plan now.",type:"o"}]},
{time:"Day 2 — 15:30",vocab:["confidentiality","conflict of interest","to disclose"],scenario:"A sales representative from a packaging supplier offers you two tickets to an expensive sporting event just before you are due to evaluate its tender. The representative says it is simply a gesture of thanks for your business.",choices:[
{text:"Accept the tickets but make sure you compare all bids fairly, since the gift will not affect your judgement.",pts:0,fb:"This creates a clear perceived conflict of interest and may breach company policy. Do not accept the gift; disclose the offer through the proper channel.",type:"f",fatal:true},
{text:"Politely decline the tickets and disclose the offer in line with your company's gifts and hospitality policy before continuing the tender evaluation.",pts:3,fb:"Excellent. You protect the integrity of the tender and create a transparent record of the offer.",type:"g"},
{text:"Accept the tickets but ask a colleague to score that supplier's bid instead of you.",pts:1,fb:"Passing the evaluation to a colleague does not necessarily resolve the policy issue or the appearance of influence. The offer still needs to be declined or reported.",type:"p"}],emergency:true},
{time:"Day 3 — 08:45",vocab:["payment terms","cash flow","to renegotiate"],scenario:"Finance has asked you to improve payment terms across the supplier base. One small packaging supplier currently requires payment in 30 days and says it cannot extend to 60 days without affecting its cash flow.",choices:[
{text:"Tell the supplier that all vendors must accept 60-day terms or lose the business, regardless of their circumstances.",pts:1,fb:"This may damage a valuable supply relationship and increase the risk of disruption. A blanket demand may not be commercially realistic.",type:"p"},
{text:"Review the supplier's strategic importance and financial position, then discuss a phased change or another arrangement with Finance before agreeing terms.",pts:3,fb:"Strong negotiation. You balance the company's cash-flow objective with supply continuity and the supplier relationship.",type:"g"},
{text:"Agree to keep the existing terms permanently without discussing the request with Finance.",pts:2,fb:"You protect continuity, but you should explain the reason and explore whether a workable compromise is possible.",type:"o"}]},
{time:"Day 3 — 10:30",vocab:["change control","formulation","to validate"],scenario:"R&D wants to replace an imported fragrance ingredient with a cheaper local alternative. The supplier can deliver next week, but the new ingredient has not yet been tested in the finished formula or checked for compatibility with the packaging.",choices:[
{text:"Place a large order now to secure the price, assuming R&D can validate the ingredient while the material is in transit.",pts:1,fb:"This commits the business before technical validation. A low price is not useful if the ingredient is unsuitable or causes a reformulation delay.",type:"p"},
{text:"Ask R&D and Quality to define the validation requirements and approval steps, while checking price, availability and supply risks in parallel.",pts:3,fb:"Correct. Purchasing can investigate commercial feasibility while respecting technical change control and product approval.",type:"g"},
{text:"Refuse to consider local alternatives because changing an established ingredient is always too risky.",pts:2,fb:"You are protecting product consistency, but a controlled assessment could identify a viable cost-saving option.",type:"o"}]},
{time:"Day 3 — 13:15",vocab:["forecast accuracy","allocation","to prioritize"],scenario:"A transport disruption means your supplier can deliver only 60% of the planned quantity of a pump used in three product lines. The supplier asks you to decide how the available pumps should be allocated.",choices:[
{text:"Allocate the pumps to the products with the highest confirmed production priority, consulting planning and sales about customer commitments and the impact on each line.",pts:3,fb:"Excellent. You make the shortage visible and prioritize supply based on agreed business needs rather than guesswork.",type:"g"},
{text:"Divide the pumps equally across the three product lines so nobody can complain that they received less.",pts:2,fb:"An equal split feels fair but may not reflect production schedules, customer commitments or the consequences of stopping a line.",type:"o"},
{text:"Give all the pumps to the product line with the highest sales revenue, without consulting other teams.",pts:1,fb:"Revenue is relevant, but the decision also depends on commitments, production constraints and the wider business impact.",type:"p"}]},
{time:"Day 3 — 15:00",vocab:["service level","key performance indicator","to monitor"],scenario:"Your supplier scorecard shows that a long-standing bottle supplier has repeatedly delivered late for three months. Its quality is excellent and its prices are competitive, but the delays have caused two production reschedules.",choices:[
{text:"Continue as normal because the supplier's quality and price are good, and delivery problems are probably temporary.",pts:1,fb:"Repeated delays have already affected production. Ignoring the pattern means the business cannot manage the risk effectively.",type:"p"},
{text:"Arrange a performance review using delivery data, ask for a root-cause analysis and corrective action plan, and agree measurable follow-up dates.",pts:3,fb:"Strong supplier management. You use evidence, address the cause and set clear expectations for improvement.",type:"g"},
{text:"Immediately remove the supplier from the approved list and transfer all orders to another company.",pts:2,fb:"A backup may be necessary, but a controlled review and contingency plan are more proportionate unless there is an immediate critical risk.",type:"o"}]},
{time:"Day 4 — 09:00",vocab:["business continuity","contingency plan","to mitigate"],scenario:"A major supplier of a key emulsifier informs you that a fire has temporarily stopped production at its plant. It cannot confirm a restart date. Your current stock will cover around ten working days, and several high-volume products depend on this ingredient.",choices:[
{text:"Wait a week for the supplier's next update before contacting alternatives, so you do not create unnecessary concern.",pts:1,fb:"The available stock gives you limited time. Waiting without preparing alternatives reduces your options if the disruption continues.",type:"p"},
{text:"Inform planning, R&D and Quality, check approved alternative sources and available stock, and build a contingency plan while requesting regular updates from the supplier.",pts:3,fb:"Excellent business continuity response. You coordinate the relevant teams and work on alternatives without bypassing qualification or quality controls.",type:"g"},
{text:"Buy the emulsifier from an unapproved online distributor immediately and arrange the paperwork after it arrives.",pts:0,fb:"FATAL ERROR. An unapproved source may not meet quality, traceability or compliance requirements. Urgency does not justify bypassing supplier qualification.",type:"f",fatal:true}] ,emergency:true}
];

let index=0, score=0, answered=false, totalMax=STEPS.reduce((n,s)=>n+Math.max(...s.choices.map(c=>c.pts)),0);
const game=document.getElementById("game");
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function renderIntro(){game.innerHTML=`<section class="intro"><div class="kicker">Purchasing department · Scenario simulation</div><h1>Every decision has a <em>cost.</em></h1><p class="lead">You are the purchaser for a cosmetics manufacturer. Over four working days, you will manage suppliers, materials, deadlines, quality risks and commercial pressure. Choose the response you think is best for the business.</p><div class="chips"><span class="chip">14 decisions</span><span class="chip">B2 English</span><span class="chip">Supplier management</span><span class="chip">Scored feedback</span></div><div class="profile"><strong>Your role: Senior Purchaser</strong><p>You source ingredients and packaging, negotiate terms, monitor supplier performance and coordinate with R&D, Quality, Production, Planning, Finance and Marketing. You are expected to balance cost, quality, compliance and continuity of supply.</p></div><div class="how"><strong>How to play</strong><p>Read each situation and select one response. You receive <b>3 points</b> for the strongest response, <b>2</b> for a workable but incomplete response, <b>1</b> for a weak response, and <b>0</b> for a critical error. Feedback appears after every choice. Your score and progress are tracked automatically.</p></div><button class="primary" onclick="startGame()">Start simulation →</button></section>`}
function startGame(){index=0;score=0;renderStep()}
function renderStep(){answered=false;const s=STEPS[index];game.innerHTML=`<div class="cardbar"><div><strong>Purchasing simulation</strong><div class="role">Cosmetics manufacturing · Senior Purchaser</div></div><div style="display:flex;align-items:center;gap:12px"><div class="progress">${STEPS.map((_,i)=>`<span class="dot ${i<index?'done':i===index?'active':''}"></span>`).join("")}</div><span class="score" id="score">Score ${score}</span></div></div><section class="body"><div class="time">${escapeHtml(s.time)} · Decision ${index+1} of ${STEPS.length}</div>${s.emergency?'<div class="emergency">⚠ HIGH-PRIORITY SITUATION — CHECK THE RISKS CAREFULLY</div>':''}<div class="vocab"><span>Key language</span>${s.vocab.map(v=>`<b>${escapeHtml(v)}</b>`).join("")}</div><p class="scenario">${escapeHtml(s.scenario)}</p><div class="options">${s.choices.map((c,i)=>`<button class="opt" id="opt${i}" onclick="choose(${i})"><span>${escapeHtml(c.text)}</span><span class="points" id="pts${i}">${c.pts} pts</span></button>`).join("")}</div><div class="feedback" id="feedback" aria-live="polite"></div><div class="nextrow"><button class="next" id="next" onclick="advance()">${index===STEPS.length-1?'View final result':'Next decision →'}</button></div></section>`}
function choose(i){if(answered)return;answered=true;const s=STEPS[index],c=s.choices[i];score+=c.pts;document.getElementById("score").textContent="Score "+score;s.choices.forEach((choice,j)=>{const b=document.getElementById("opt"+j),p=document.getElementById("pts"+j);b.disabled=true;p.classList.add("show");if(j===i)b.classList.add(choice.pts===3?"good":choice.pts===2?"mid":"bad")});const f=document.getElementById("feedback");f.className="feedback show "+(c.pts===3?"good":c.pts===2?"mid":"bad");f.innerHTML=`<strong>${c.pts===3?"Strong decision":c.pts===2?"Partly effective":c.fatal?"Critical error":"Weak decision"} · ${c.pts} point${c.pts===1||c.pts===0?"":"s"}</strong><br>${escapeHtml(c.fb)}`;document.getElementById("next").classList.add("show")}
function advance(){if(index<STEPS.length-1){index++;renderStep()}else renderFinal()}
function renderFinal(){const pct=Math.round(score/totalMax*100);let title,desc;if(pct>=85){title="Excellent purchasing judgement";desc="You consistently balance commercial objectives with quality, compliance, supplier relationships and continuity of supply. You also involve the right stakeholders before committing the business."}else if(pct>=70){title="Strong professional performance";desc="You usually identify the right priorities. To improve further, make sure every decision is supported by evidence, clear ownership and appropriate approval."}else if(pct>=50){title="Developing your approach";desc="You recognize some important commercial issues, but several choices leave avoidable risks. Focus on total cost, documented quality checks and early communication with stakeholders."}else{title="Review the risks before committing";desc="Several decisions could expose the company to quality, supply or compliance problems. In purchasing, urgency and low prices do not replace validation, traceability or a documented risk assessment."}game.innerHTML=`<section class="final"><div class="kicker" style="text-align:center">Simulation complete</div><div class="scoreblock"><div class="bigscore">${score}</div><div class="denom">POINTS OUT OF ${totalMax} · ${pct}%</div><div class="bar"><div class="fill" id="fill"></div></div></div><div class="grade">${title}</div><p>${desc}</p><div class="summary"><h3>Key purchasing principles</h3><p>• Compare total cost, not just unit price.<br>• Escalate quality, traceability and compliance concerns before material is released.<br>• Use forecasts, stock data and supplier performance evidence.<br>• Involve R&D, Quality, Planning and Finance when decisions affect their responsibilities.<br>• Keep supplier relationships professional, transparent and documented.</p></div><p><strong>Trainer follow-up:</strong> Choose two decisions that were difficult. Explain your reasoning, identify the business risk and describe what information you would need before making a final decision.</p><button class="replay" onclick="renderIntro()">↻ Replay simulation</button></section>`;requestAnimationFrame(()=>{const f=document.getElementById("fill");if(f)f.style.width=pct+"%"})}
renderIntro();
</script>
</body>
</html>
